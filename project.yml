name: TodoList
options:
  bundleIdPrefix: com.rishavjha.larpios
  deploymentTarget:
    iOS: "17.0"

targets:
  TodoList:
    type: application
    platform: iOS
    sources:
      - path: TodoList
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishavjha.larpios.todolist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: TodoList/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  TodoListTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TodoListTests
    dependencies:
      - target: TodoList
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TodoList:
    build:
      targets:
        TodoList: all
        TodoListTests: [test]
    test:
      targets:
        - TodoListTests
